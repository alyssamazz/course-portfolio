<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | BerwynAI Academy</title>
  <meta name="description" content="That page does not exist. Head back to the catalogue." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!--
    Styles are inlined rather than linked. GitHub Pages serves this file for
    unknown paths at any depth, so a relative stylesheet link resolves
    differently depending on the URL that missed, and an absolute one breaks
    on a project site served from /repo/. Inlining is a few hundred bytes and
    works in every case, which matters most on the one page a visitor reaches
    by accident.
  -->
  <style>
    :root {
      --indigo:#4f46e5; --indigo-dark:#3730a3; --teal:#14b8a6;
      --bg:#fafafa; --surface:#fff; --border:#e5e7eb;
      --text:#18181b; --muted:#52525b;
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
    .bar{height:4px;background:linear-gradient(90deg,var(--indigo),var(--teal))}
    header{background:var(--surface);border-bottom:1px solid var(--border)}
    .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
    .brandrow{display:flex;align-items:center;height:72px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;color:var(--text);text-decoration:none}
    .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--indigo),var(--teal));
          display:flex;align-items:center;justify-content:center;color:#fff;font-size:.95rem;font-weight:800}
    .sub{font-weight:500;color:var(--muted);font-size:.85rem}
    main{text-align:center;padding:100px 24px 130px}
    .kicker{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--indigo);margin:0}
    h1{margin:10px 0 16px;font-size:2.1rem;letter-spacing:-.5px}
    p.lead{max-width:520px;margin:0 auto 32px;color:var(--muted);font-size:1.05rem}
    .btn{display:inline-block;background:var(--indigo);color:#fff;text-decoration:none;font-weight:700;
         padding:13px 26px;border-radius:8px;font-size:.95rem}
    .btn:hover{background:var(--indigo-dark)}
    footer{border-top:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:.85rem}
    .footrow{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px 0}
    @media (max-width:640px){h1{font-size:1.6rem}main{padding:70px 20px 90px}}
  </style>
</head>
<body>

  <div class="bar"></div>

  <header>
    <div class="wrap brandrow">
      <a class="brand" href="./">
        <span class="mark">B</span>
        <span>BerwynAI <span class="sub">Academy</span></span>
      </a>
    </div>
  </header>

  <main>
    <p class="kicker">404</p>
    <h1>That page does not exist.</h1>
    <p class="lead">
      The link may be out of date, or the page may have moved. Everything is
      reachable from the catalogue.
    </p>
    <a href="./" class="btn">Back to the catalogue</a>
  </main>

  <footer>
    <div class="wrap footrow">
      <span>&copy; 2026 BerwynAI Academy</span>
      <span>Course design, writing and front end build by Alyssa Mazziotta.</span>
    </div>
  </footer>

</body>
</html>
